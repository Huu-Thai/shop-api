# Local routing: every alert is e-mailed to Mailpit (http://localhost:8026). In production replace
# the receiver with your pager (PagerDuty, Opsgenie) for `critical` and chat/e-mail for `warning`.
global:
  smtp_smarthost: 'mailpit:1025'
  smtp_from: 'alerts@shop.localhost'
  smtp_require_tls: false

route:
  receiver: ops-email
  group_by: [alertname, queue, type]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: ops-email
      repeat_interval: 1h

receivers:
  - name: ops-email
    email_configs:
      - to: 'ops@shop.localhost'
        send_resolved: true

# While an instance is down, don't also page for what follows from it.
inhibit_rules:
  - source_matchers: [alertname=~"ShopApiDown|ShopWorkerDown"]
    target_matchers: [severity="warning"]
